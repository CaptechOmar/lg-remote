name: Release APK

# Publishes a GitHub release with an installable APK whenever a version tag (v*) is pushed,
# e.g. `git tag v0.6.0 && git push origin v0.6.0`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/*.apk "lg-remote-${TAG}.apk"
          gh release create "$TAG" "lg-remote-${TAG}.apk" \
            --title "LG Remote ${TAG}" \
            --notes-file .github/release-notes.md

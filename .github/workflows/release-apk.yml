name: Release APK

# Publishes a GitHub release with an installable APK, and creates the version tag for it.
# Start it from the Actions tab: Release APK > Run workflow > enter a version such as v0.6.0.
# Pushing a v* tag does the same.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, e.g. v0.6.0"
        required: true
        default: "v0.6.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/*.apk "lg-remote-${TAG}.apk"
          gh release create "$TAG" "lg-remote-${TAG}.apk" \
            --title "LG Remote ${TAG}" \
            --target "$GITHUB_SHA" \
            --notes-file .github/release-notes.md

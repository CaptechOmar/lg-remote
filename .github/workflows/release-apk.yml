name: Release APK

# Publishes a GitHub release with an installable APK, and creates the version tag for it.
# Start it from the Actions tab: Release APK > Run workflow > enter a version such as v0.6.0.
# Pushing a v* tag does the same.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, e.g. v0.6.0"
        required: true
        default: "v0.6.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LGREMOTE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lgremote.keystore"
            echo "LGREMOTE_KEYSTORE=$RUNNER_TEMP/lgremote.keystore" >> "$GITHUB_ENV"
            echo "LGREMOTE_KEYSTORE_PASSWORD=${{ secrets.LGREMOTE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "LGREMOTE_KEY_ALIAS=${{ secrets.LGREMOTE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "LGREMOTE_KEY_PASSWORD=${{ secrets.LGREMOTE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing key configured, using the temporary debug key"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # One APK with a fixed name, so that
          # https://github.com/CaptechOmar/lg-remote/releases/latest/download/lg-remote.apk
          # always downloads the newest stable APK (this is what the README button links to)
          cp app/build/outputs/apk/release/*.apk lg-remote.apk
          gh release create "$TAG" lg-remote.apk \
            --latest \
            --title "LG Remote ${TAG}" \
            --target "$GITHUB_SHA" \
            --notes-file .github/release-notes.md

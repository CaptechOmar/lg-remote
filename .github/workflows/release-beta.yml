name: Release Beta APK

# Publishes a pre-release with the beta app, which installs as an update over the stable app (same app, same signing key).
# Start it from the Actions tab: Release Beta APK > Run workflow. Pick the branch to build under
# "Use workflow from", and enter a version such as v0.7.0-beta.1.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, e.g. v0.7.0-beta.1"
        required: true
        default: "v0.7.0-beta.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LGREMOTE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lgremote.keystore"
            echo "LGREMOTE_KEYSTORE=$RUNNER_TEMP/lgremote.keystore" >> "$GITHUB_ENV"
            echo "LGREMOTE_KEYSTORE_PASSWORD=${{ secrets.LGREMOTE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "LGREMOTE_KEY_ALIAS=${{ secrets.LGREMOTE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "LGREMOTE_KEY_PASSWORD=${{ secrets.LGREMOTE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing key configured, using the temporary debug key"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build the beta APK
        run: ./gradlew assembleBeta

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version }}
        run: |
          cp app/build/outputs/apk/beta/*.apk "lg-remote-${TAG}.apk"
          gh release create "$TAG" "lg-remote-${TAG}.apk" \
            --prerelease \
            --title "LG Remote Beta ${TAG}" \
            --target "$GITHUB_SHA" \
            --notes-file .github/beta-release-notes.md

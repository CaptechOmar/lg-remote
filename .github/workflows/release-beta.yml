name: Release Beta APK

# Publishes a pre-release with the beta app, which installs next to the stable app.
# Start it from the Actions tab: Release Beta APK > Run workflow. Pick the branch to build under
# "Use workflow from", and enter a version such as v0.7.0-beta.1.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, e.g. v0.7.0-beta.1"
        required: true
        default: "v0.7.0-beta.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build the beta APK
        run: ./gradlew assembleBeta

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version }}
        run: |
          cp app/build/outputs/apk/beta/*.apk "lg-remote-${TAG}.apk"
          gh release create "$TAG" "lg-remote-${TAG}.apk" \
            --prerelease \
            --title "LG Remote Beta ${TAG}" \
            --target "$GITHUB_SHA" \
            --notes-file .github/beta-release-notes.md
